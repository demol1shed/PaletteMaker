name: CI

# Her push ve çekme isteğinde çözümü derler ve testleri çalıştırır (Android hariç; o ayrı iş akışında).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release --nologo
      - name: Test
        run: dotnet test -c Release --no-build --nologo
